# Default Queries for Inturmex

# Get all active destinations
query GetDestinos @auth(level: PUBLIC, insecureReason: "Public travel data") {
  destinos(where: { activo: { eq: true } }, orderBy: [{ orden: ASC }]) {
    id
    nombre
    slug
    imagenUrl
    descripcion
  }
}

# Get a destination by ID
query GetDestino($id: String!) @auth(level: PUBLIC, insecureReason: "Public travel data") {
  destino(id: $id) {
    id
    nombre
    imagenUrl
    descripcion
  }
}

# Get a destination by slug
query GetDestinoBySlug($slug: String!) @auth(level: PUBLIC, insecureReason: "Public travel data") {
  destinos(where: { slug: { eq: $slug } }) {
    id
    nombre
    imagenUrl
    descripcion
  }
}

# Get circuits by destination
query GetCircuitos($destinoId: String) @auth(level: PUBLIC, insecureReason: "Public travel data") {
  circuitos(where: { 
    activo: { eq: true },
    destino: { id: { eq: $destinoId } }
  }) {
    id
    nombre
    paises
    ciudades
    duracionDias
    precioUsd
    impuestosUsd
    imagenUrl
    destacado
  }
}

# Get circuit detail by ID
query GetCircuitoDetail($id: UUID!) @auth(level: PUBLIC, insecureReason: "Public travel data") {
  circuito(id: $id) {
    id
    nombre
    paises
    ciudades
    duracionDias
    precioUsd
    impuestosUsd
    tipoHabitacion
    imagenUrl
    descripcion
    itinerarios_on_circuito {
      dia
      titulo
      descripcion
    }
    hotels_on_circuito {
      nombre
      ciudad
      tipo
    }
    tarifas_on_circuito {
      tipo
      precioUsd
    }
  }
}
 
# Get all reservations (for Admin)
query GetAllReservaciones @auth(level: PUBLIC, insecureReason: "Admin panel - will add RBAC later") {
  reservacions(orderBy: [{ fechaViaje: DESC }]) {
    id
    fechaViaje
    numPersonas
    precioTotalUsd
    estatus
    usuario {
      displayName
      email
    }
    circuito {
      nombre
    }
    paquete {
      nombre
    }
  }
}

# Get user by ID to check role
query GetUserById($id: String!) @auth(level: PUBLIC, insecureReason: "Check role during auth") {
  user(id: $id) {
    id
    displayName
    email
    role
    photoUrl
  }
}

# List all users to debug duplicates
query ListAllUsers @auth(level: PUBLIC, insecureReason: "Debug") {
  users {
    id
    displayName
    email
    role
    createdAt
  }
}
