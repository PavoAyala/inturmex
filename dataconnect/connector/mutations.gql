# Default Mutations for Inturmex

# Create a new destination
mutation CreateDestino(
  $id: String!
  $nombre: String!
  $slug: String!
  $activo: Boolean!
  $imagenUrl: String
  $descripcion: String
  $orden: Int
) @auth(level: PUBLIC, insecureReason: "Admin and dev seeding") {
  destino_insert(data: { 
    id: $id,
    nombre: $nombre, 
    slug: $slug, 
    activo: $activo, 
    imagenUrl: $imagenUrl, 
    descripcion: $descripcion, 
    orden: $orden 
  })
}

# Create a new circuit
mutation CreateCircuito(
  $nombre: String!
  $destinoId: String!
  $duracionDias: Int!
  $precioUsd: Float!
  $impuestosUsd: Float!
  $activo: Boolean!
  $destacado: Boolean!
  $paises: String
  $ciudades: String
  $tipoHabitacion: String
  $imagenUrl: String
  $descripcion: String
) @auth(level: PUBLIC, insecureReason: "Admin and dev seeding") {
  circuito_insert(data: { 
    nombre: $nombre, 
    destino: { id: $destinoId }, 
    duracionDias: $duracionDias, 
    precioUsd: $precioUsd, 
    impuestosUsd: $impuestosUsd, 
    activo: $activo, 
    destacado: $destacado,
    paises: $paises,
    ciudades: $ciudades,
    tipoHabitacion: $tipoHabitacion,
    imagenUrl: $imagenUrl,
    descripcion: $descripcion
  })
}

# Create or update a user
mutation UpsertUser(
  $id: String!
  $displayName: String!
  $email: String
  $photoUrl: String
) @auth(level: PUBLIC, insecureReason: "User login") {
  user_upsert(data: {
    id: $id,
    displayName: $displayName,
    email: $email,
    photoUrl: $photoUrl
  })
}

# Create a new hotel
mutation CreateHotel(
  $circuitoId: UUID!
  $nombre: String!
  $ciudad: String
  $tipo: String
  $pais: String
) @auth(level: PUBLIC, insecureReason: "Admin and dev seeding") {
  hotel_insert(data: {
    circuito: { id: $circuitoId },
    nombre: $nombre,
    ciudad: $ciudad,
    tipo: $tipo,
    pais: $pais
  })
}

# Create a new rate
mutation CreateTarifa(
  $circuitoId: UUID!
  $tipo: String!
  $precioUsd: Float!
  $impuestosUsd: Float
  $anio: Int
) @auth(level: PUBLIC, insecureReason: "Admin and dev seeding") {
  tarifa_insert(data: {
    circuito: { id: $circuitoId },
    tipo: $tipo,
    precioUsd: $precioUsd,
    impuestosUsd: $impuestosUsd,
    anio: $anio
  })
}

# Create an itinerary day
mutation CreateItinerario(
  $circuitoId: UUID!
  $dia: Int!
  $titulo: String!
  $descripcion: String!
) @auth(level: PUBLIC, insecureReason: "Admin and dev seeding") {
  itinerario_insert(data: {
    circuito: { id: $circuitoId },
    dia: $dia,
    titulo: $titulo,
    descripcion: $descripcion
  })
}

# Update an existing circuit
mutation UpdateCircuito(
  $id: UUID!
  $nombre: String
  $imagenUrl: String
  $descripcion: String
  $paises: String
  $ciudades: String
) @auth(level: PUBLIC, insecureReason: "Admin and dev seeding") {
  circuito_update(id: $id, data: {
    nombre: $nombre,
    imagenUrl: $imagenUrl,
    descripcion: $descripcion,
    paises: $paises,
    ciudades: $ciudades
  })
}
